name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pipeline integrity checks
        shell: powershell
        run: |
          $get = Get-Content -LiteralPath .\Get.ps1 -Raw
          if ($get -notmatch 'Test-Sha256File') { throw "Get.ps1 must verify release SHA256 (Test-Sha256File missing)." }
          if ($get -notmatch 'Get-ReleaseDownload') { throw "Get.ps1 must prefer GitHub release ZIPs." }
          $build = Get-Content -LiteralPath .\Build-Release.ps1 -Raw
          if ($build -notmatch '\.sha256') { throw "Build-Release.ps1 must emit a .sha256 checksum file." }
          if ($build -notmatch 'Get-FileHash') { throw "Build-Release.ps1 must hash the ZIP with Get-FileHash." }
          if (-not (Test-Path -LiteralPath .\VERSION)) { throw "VERSION file is required." }
          $ver = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          if ($ver -notmatch '^\d+(\.\d+){1,3}$') { throw "VERSION is invalid: $ver" }
          Write-Host "Pipeline integrity OK (VERSION=$ver)"

      - name: Run tests
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tests\PathHelpers.Tests.ps1

      - name: Build ZIP and verify SHA256
        env:
          PCMK_SIGN_PFX_BASE64: ${{ secrets.PCMK_SIGN_PFX_BASE64 }}
          PCMK_SIGN_PFX_PASSWORD: ${{ secrets.PCMK_SIGN_PFX_PASSWORD }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Build-Release.ps1
          $ver = (Get-Content -LiteralPath .\VERSION -Raw).Trim()
          $zip = Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "dist\PC-Maintenance-Kit-v$ver.zip")
          $sha = $zip.FullName + '.sha256'
          if (-not (Test-Path -LiteralPath $sha)) { throw "Checksum file was not created: $sha" }
          $raw = Get-Content -LiteralPath $sha -Raw
          if ($raw -notmatch '([A-Fa-f0-9]{64})') { throw "Checksum file did not contain a SHA256 hash." }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "SHA256 mismatch. expected=$expected actual=$actual"
          }
          # Staged payload must include VERSION matching AppVersion
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\PC-Maintenance-Kit-v$ver"
          $stageVer = (Get-Content -LiteralPath (Join-Path $stage 'VERSION') -Raw).Trim()
          if ($stageVer -ne $ver) { throw "Staged VERSION mismatch" }
          Write-Host ("SHA256 OK {0}  {1}" -f $actual, $zip.Name)
